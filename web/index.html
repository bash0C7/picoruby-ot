<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>picoruby-ot Synth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #ccc;
      font-family: monospace;
      font-size: 12px;
      width: 100vw;
      overflow-x: hidden;
    }

    /* ── Header Bar ── */
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #12122a;
      border-bottom: 1px solid #2a2a4a;
      flex-wrap: wrap;
    }
    #header button {
      padding: 5px 12px;
      background: #1e1e3a;
      border: 1px solid #4444aa;
      color: #aab;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      border-radius: 3px;
    }
    #header button:hover { border-color: #4caf50; color: #4caf50; }
    #header #btn-init-audio { border-color: #6644cc; color: #9977ee; }
    #serial-status { font-size: 18px; color: #f44336; line-height: 1; }
    #header-spacer { flex: 1; }
    #note-info {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #aaa;
    }
    #note-display { color: #4caf50; font-weight: bold; font-size: 15px; }
    #freq-display { color: #6cf; }
    #dist-display { color: #fc6; }

    /* ── Main Area ── */
    #main { padding: 10px 12px; }

    /* ── Section common ── */
    .sec {
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 5px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .sec-title {
      color: #7777cc;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    /* ── Synth Patch Graph ── */
    #patch-graph {
      display: flex;
      align-items: flex-start;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    /* Arrow between nodes */
    .node-arrow {
      display: flex;
      align-items: center;
      color: #4caf50;
      font-size: 16px;
      padding: 0 4px;
      align-self: center;
      margin-top: 16px;
    }
    .node-arrow.fm {
      color: #6644cc;
      font-size: 12px;
      flex-direction: column;
      align-self: flex-start;
      margin-top: 4px;
      padding: 0 2px;
    }

    /* Node box */
    .node {
      background: #0e0e1e;
      border: 1px solid #2a2a6a;
      border-radius: 4px;
      padding: 6px 8px;
      min-width: 120px;
      flex-shrink: 0;
    }
    .node-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a4a;
    }
    .node.fm-mod .node-title   { color: #9966ff; border-color: #4433aa; }
    .node.fm-carrier .node-title { color: #9966ff; border-color: #4433aa; }
    .node.mixer .node-title    { color: #cc88ff; border-color: #552299; }
    .node.filter .node-title   { color: #ffaa44; border-color: #664422; }
    .node.master .node-title   { color: #4caf50; border-color: #225533; }

    .node-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }
    .node-row label {
      width: 52px;
      color: #666;
      font-size: 10px;
      flex-shrink: 0;
    }
    .node-row input[type="range"] {
      flex: 1;
      accent-color: #4caf50;
      height: 12px;
      min-width: 60px;
    }
    .node-row select {
      flex: 1;
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 10px;
      padding: 1px 3px;
      border-radius: 2px;
    }
    .node-row .nv {
      width: 36px;
      text-align: right;
      color: #777;
      font-size: 10px;
      flex-shrink: 0;
    }

    /* FM mod group (vertically stacked above carrier) */
    #fm-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }
    #fm-arrow-vert {
      color: #6644cc;
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
      padding: 2px 0;
    }

    /* ── Mid Panel ── */
    #mid-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    /* Curve buttons */
    .curve-buttons {
      display: flex;
      gap: 3px;
      margin-bottom: 4px;
    }
    .curve-buttons button {
      padding: 2px 8px;
      background: #1a1a2e;
      border: 1px solid #333;
      color: #777;
      cursor: pointer;
      font-family: monospace;
      font-size: 10px;
      border-radius: 2px;
    }
    .curve-buttons button:hover { border-color: #4caf50; color: #4caf50; }
    .curve-buttons button.active { border-color: #4caf50; color: #4caf50; background: #0a1a0a; }
    .curve-label {
      color: #555;
      font-size: 10px;
      margin-bottom: 3px;
    }
    canvas.curve-canvas {
      display: block;
      width: 100%;
      height: 50px;
      border: 1px solid #1e1e3a;
      border-radius: 2px;
      margin-bottom: 6px;
    }

    /* Transport buttons */
    .btn-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .btn-group button {
      padding: 3px 9px;
      background: #1a1a2e;
      border: 1px solid #333;
      color: #888;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
      border-radius: 3px;
    }
    .btn-group button:hover { border-color: #4caf50; color: #4caf50; }
    .btn-group button.active { border-color: #4caf50; color: #4caf50; background: #0a150a; }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .ctrl-row label { width: 64px; color: #666; font-size: 10px; flex-shrink: 0; }
    .ctrl-row input[type="range"] { flex: 1; accent-color: #4caf50; height: 12px; }
    .ctrl-row .cv { width: 40px; text-align: right; color: #777; font-size: 10px; flex-shrink: 0; }

    /* Octave control */
    #oct-display {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    #oct-display label { color: #666; font-size: 10px; }
    #oct-display .oct-dots {
      display: flex;
      gap: 3px;
    }
    .oct-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      border: 1px solid #444;
    }
    .oct-dot.active { background: #4caf50; border-color: #4caf50; }
    #oct-display button {
      padding: 1px 7px;
      background: #1a1a2e;
      border: 1px solid #333;
      color: #888;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
      border-radius: 2px;
    }
    #oct-display button:hover { border-color: #4caf50; color: #4caf50; }

    /* ── Audio Monitor ── */
    #audio-monitor {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 8px;
      align-items: stretch;
    }
    canvas#oscilloscope {
      display: block;
      width: 100%;
      height: 80px;
      border: 1px solid #1e1e3a;
      border-radius: 3px;
    }
    canvas#level-meter {
      display: block;
      width: 100%;
      height: 80px;
      border: 1px solid #1e1e3a;
      border-radius: 3px;
    }

    /* ── Serial & Test (collapsible) ── */
    details { margin-bottom: 10px; }
    details summary {
      color: #7777cc;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 8px 12px;
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 5px;
      list-style: none;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▶ "; color: #4444aa; }
    details[open] summary {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom: none;
    }
    details[open] summary::before { content: "▼ "; }
    .details-body {
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-top: none;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      padding: 10px 12px;
    }
    #serial-monitor {
      background: #080812;
      border: 1px solid #1a1a3a;
      border-radius: 3px;
      padding: 6px;
      height: 60px;
      overflow-y: auto;
      font-size: 10px;
      color: #4caf50;
      word-break: break-all;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<!-- ── Header Bar ── -->
<div id="header">
  <button id="btn-connect">Connect</button>
  <button id="btn-disconnect">Disconnect</button>
  <button id="btn-init-audio">Init Audio</button>
  <span>Status:</span>
  <span id="serial-status">●</span>
  <div id="header-spacer"></div>
  <div id="note-info">
    <span>Note: <span id="note-display">--</span></span>
    <span><span id="freq-display">--</span></span>
    <span><span id="dist-display">--</span></span>
  </div>
</div>

<div id="main">

  <!-- ── Synth Patch Graph ── -->
  <div class="sec">
    <div class="sec-title">Synth Patch Graph</div>
    <div id="patch-graph">

      <!-- FM Mod + FM Carrier stacked vertically with arrow -->
      <div id="fm-group">
        <!-- FM Mod node -->
        <div class="node fm-mod">
          <div class="node-title">FM Mod</div>
          <div class="node-row">
            <label>Wave</label>
            <select data-param="fm_mod:waveform">
              <option value="triangle" selected>triangle</option>
              <option value="sine">sine</option>
              <option value="square">square</option>
              <option value="sawtooth">sawtooth</option>
            </select>
          </div>
          <div class="node-row">
            <label>Freq</label>
            <input type="range" min="20" max="2000" value="220" data-param="fm_mod:freq">
            <span class="nv">220</span>
          </div>
          <div class="node-row">
            <label>Amp</label>
            <input type="range" min="0" max="500" value="50" data-param="fm_mod:amp">
            <span class="nv">50</span>
          </div>
        </div>

        <!-- Vertical FM arrow -->
        <div id="fm-arrow-vert">│<br>FM<br>▼</div>

        <!-- FM Carrier node -->
        <div class="node fm-carrier">
          <div class="node-title">FM Carrier</div>
          <div class="node-row">
            <label>Wave</label>
            <select data-param="fm_carrier:waveform">
              <option value="triangle" selected>triangle</option>
              <option value="sine">sine</option>
              <option value="square">square</option>
              <option value="sawtooth">sawtooth</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Arrow: Carrier → Mixer -->
      <div class="node-arrow">→</div>

      <!-- Mixer node -->
      <div class="node mixer">
        <div class="node-title">Mixer</div>
        <div class="node-row">
          <label>Gain</label>
          <input type="range" min="0" max="2" step="0.01" value="1" data-param="mixer:gain">
          <span class="nv">1.0</span>
        </div>
      </div>

      <!-- Arrow: Mixer → Filter -->
      <div class="node-arrow">→</div>

      <!-- Filter node -->
      <div class="node filter">
        <div class="node-title">Filter</div>
        <div class="node-row">
          <label>Type</label>
          <select data-param="filter:filter_type">
            <option value="lowpass" selected>lowpass</option>
            <option value="highpass">highpass</option>
            <option value="bandpass">bandpass</option>
            <option value="notch">notch</option>
          </select>
        </div>
        <div class="node-row">
          <label>Cutoff</label>
          <input type="range" min="20" max="20000" value="800" data-param="filter:cutoff">
          <span class="nv">800</span>
        </div>
        <div class="node-row">
          <label>Q</label>
          <input type="range" min="0.1" max="20" step="0.1" value="1.2" data-param="filter:q">
          <span class="nv">1.2</span>
        </div>
      </div>

      <!-- Arrow: Filter → Master -->
      <div class="node-arrow">→</div>

      <!-- Master node -->
      <div class="node master">
        <div class="node-title">Master</div>
        <div class="node-row">
          <label>Gain</label>
          <input type="range" min="0" max="1" step="0.01" value="0.4" data-param="master:gain">
          <span class="nv">0.4</span>
        </div>
      </div>

      <!-- Output indicator -->
      <div class="node-arrow">→ ♪</div>

    </div>
  </div>

  <!-- ── Mid Panel ── -->
  <div id="mid-panel">

    <!-- Left: Sensor Mapping Curves -->
    <div class="sec">
      <div class="sec-title">Sensor Mapping</div>

      <div class="curve-label">Dist → Pitch</div>
      <div class="curve-buttons" data-curve-target="dist">
        <button data-curve="linear" class="active">Lin</button>
        <button data-curve="log">Log</button>
        <button data-curve="exp">Exp</button>
        <button data-curve="s_curve">S</button>
      </div>
      <canvas class="curve-canvas" id="dist-curve-canvas" width="200" height="50"></canvas>

      <div class="curve-label">Accel → FM Depth</div>
      <div class="curve-buttons" data-curve-target="accel">
        <button data-curve="linear" class="active">Lin</button>
        <button data-curve="log">Log</button>
        <button data-curve="exp">Exp</button>
        <button data-curve="s_curve">S</button>
      </div>
      <canvas class="curve-canvas" id="accel-curve-canvas" width="200" height="50"></canvas>
    </div>

    <!-- Right: Transport -->
    <div class="sec">
      <div class="sec-title">Transport</div>

      <!-- Presets -->
      <div id="presets" class="btn-group">
        <button data-preset="otamatone" class="active">Otamatone</button>
        <button data-preset="clean">Clean</button>
        <button data-preset="acid">Acid</button>
        <button data-preset="retro">Retro</button>
      </div>

      <!-- Scale -->
      <div id="scale-select" class="btn-group">
        <button data-scale="pentatonic" class="active">Penta</button>
        <button data-scale="major">Major</button>
        <button data-scale="minor">Minor</button>
        <button data-scale="chromatic">Chrom</button>
      </div>

      <!-- Octave -->
      <div id="oct-display">
        <label>Oct</label>
        <button id="oct-down">◀</button>
        <div class="oct-dots">
          <div class="oct-dot" id="oct-dot-0"></div>
          <div class="oct-dot" id="oct-dot-1"></div>
          <div class="oct-dot active" id="oct-dot-2"></div>
          <div class="oct-dot" id="oct-dot-3"></div>
          <div class="oct-dot" id="oct-dot-4"></div>
        </div>
        <button id="oct-up">▶</button>
      </div>

      <!-- Glide, Attack, Release sliders -->
      <div class="ctrl-row">
        <label>Glide</label>
        <input type="range" id="glide" min="10" max="2000" value="300">
        <span class="cv" id="glide-val">300ms</span>
      </div>
      <div class="ctrl-row">
        <label>Attack</label>
        <input type="range" id="attack" min="1" max="2000" value="10">
        <span class="cv" id="attack-val">10ms</span>
      </div>
      <div class="ctrl-row">
        <label>Release</label>
        <input type="range" id="release" min="10" max="5000" value="200">
        <span class="cv" id="release-val">200ms</span>
      </div>
    </div>

  </div>

  <!-- ── Audio Monitor ── -->
  <div class="sec">
    <div class="sec-title">Audio Monitor</div>
    <div id="audio-monitor">
      <canvas id="oscilloscope" width="800" height="80"></canvas>
      <canvas id="level-meter" width="200" height="80"></canvas>
    </div>
  </div>

  <!-- ── Serial Monitor (collapsible) ── -->
  <details>
    <summary>Serial Monitor</summary>
    <div class="details-body">
      <div id="serial-monitor"></div>
    </div>
  </details>

  <!-- ── Test Mode (collapsible) ── -->
  <details>
    <summary>Test Mode (no hardware)</summary>
    <div class="details-body">
      <div class="btn-group" style="margin-bottom:8px">
        <button id="test-send">Send Frame</button>
      </div>
      <div class="ctrl-row">
        <label>Dist mm</label>
        <input type="range" id="test-dist" min="20" max="900" value="450">
        <span class="cv" id="test-dist-val">450</span>
      </div>
      <div class="ctrl-row">
        <label>AX</label>
        <input type="range" id="test-ax" min="-1000" max="1000" value="0">
        <span class="cv" id="test-ax-val">0</span>
      </div>
      <div class="ctrl-row">
        <label>AY</label>
        <input type="range" id="test-ay" min="-1000" max="1000" value="0">
        <span class="cv" id="test-ay-val">0</span>
      </div>
      <div class="ctrl-row">
        <label>AZ</label>
        <input type="range" id="test-az" min="-1000" max="1000" value="0">
        <span class="cv" id="test-az-val">0</span>
      </div>
    </div>
  </details>

</div><!-- /#main -->

<script type="text/ruby" src="src/ruby/synth_patch/osc_node.rb?v=20260329d"></script>

<script>
// ============================================================
// Web Serial — async API kept in JS
// ============================================================
let serialPort = null;
let serialReader = null;

document.getElementById('btn-connect').addEventListener('click', async () => {
  try {
    serialPort = await navigator.serial.requestPort();
    await serialPort.open({ baudRate: 115200 });
    const decoder = new TextDecoderStream();
    serialPort.readable.pipeTo(decoder.writable).catch(e => {
      console.error('[Serial pipeTo]', e);
      appendSerialMonitor('[PIPE ERR] ' + e.message);
    });
    serialReader = decoder.readable.getReader();
    if (window.rubySerialOnConnect) window.rubySerialOnConnect(115200);
    document.getElementById('serial-status').textContent = '●';
    document.getElementById('serial-status').style.color = '#4caf50';
    readLoop();
  } catch (e) { console.error('Serial:', e); }
});

document.getElementById('btn-disconnect').addEventListener('click', async () => {
  try {
    if (serialReader) { await serialReader.cancel(); serialReader = null; }
    if (serialPort)   { await serialPort.close();   serialPort   = null; }
    if (window.rubySerialOnDisconnect) window.rubySerialOnDisconnect();
    document.getElementById('serial-status').textContent = '●';
    document.getElementById('serial-status').style.color = '#f44336';
  } catch (e) { console.error('Serial disconnect:', e); }
});

async function readLoop() {
  while (serialReader) {
    try {
      const { value, done } = await serialReader.read();
      if (done) { appendSerialMonitor('[DISCONNECT] stream ended'); break; }
      if (value && window.rubySerialOnReceive) window.rubySerialOnReceive(value);
    } catch (e) {
      appendSerialMonitor('[ERR] ' + e.message);
      break;
    }
  }
}

// ============================================================
// Audio init (requires user gesture)
// ============================================================
document.getElementById('btn-init-audio').addEventListener('click', () => {
  if (window.rubyInitAudio) {
    window.rubyInitAudio();
    document.getElementById('btn-init-audio').textContent = 'Audio Ready';
    document.getElementById('btn-init-audio').style.borderColor = '#4caf50';
    document.getElementById('btn-init-audio').style.color = '#4caf50';
  }
});

// ============================================================
// SynthPatch: build Web Audio graph from Ruby JSON spec
// ============================================================
let audioContext;
let analyser, analyserData;
const sp = { nodes: {}, outputId: null, pitchIds: [], modIds: [], spec: null };
let _prevActive = false;

function ensureAnalyser(outputNode) {
  if (!analyser) {
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.6;
    analyserData = new Float32Array(analyser.fftSize);
    window.analyser = analyser;
    window.analyserData = analyserData;
  }
  outputNode.connect(analyser);
  analyser.connect(audioContext.destination);
}

window.synthPatchBuild = function(json) {
  if (!audioContext) {
    audioContext = new AudioContext();
  }
  Object.values(sp.nodes).forEach(n => { try { n.disconnect(); } catch (_) {} });
  if (analyser) { try { analyser.disconnect(); } catch (_) {} analyser = null; window.analyser = null; }
  sp.nodes = {}; sp.outputId = null; sp.pitchIds = []; sp.modIds = [];

  const s = JSON.parse(json);
  sp.spec = s;

  s.nodes.forEach(ns => {
    let n;
    if (ns.type === 'oscillator' || ns.type === 'fm_op') {
      n = audioContext.createOscillator();
      n.type = ns.params.waveform || 'sine';
      n.frequency.value = +ns.params.frequency || 440;
      if (ns.params.amplitude != null) {
        const g = audioContext.createGain(); g.gain.value = +ns.params.amplitude;
        n.connect(g); sp.nodes['_amp_' + ns.id] = g;
      }
    } else if (ns.type === 'filter') {
      n = audioContext.createBiquadFilter();
      n.type = ns.params.filter_type || 'lowpass';
      n.frequency.value = +ns.params.cutoff || 1000;
      n.Q.value = +ns.params.q || 1;
    } else if (ns.type === 'gain' || ns.type === 'mixer') {
      n = audioContext.createGain();
      n.gain.value = ns.type === 'gain' ? (+ns.params.gain || 1) : 1;
    }
    if (n) sp.nodes[ns.id] = n;
  });

  s.connections.forEach(c => {
    const f = sp.nodes['_amp_' + c.from] || sp.nodes[c.from], t = sp.nodes[c.to];
    if (f && t) f.connect(t);
  });
  s.fm_connections.forEach(fm => {
    const m = sp.nodes['_amp_' + fm.mod] || sp.nodes[fm.mod], c = sp.nodes[fm.carrier];
    if (m && c?.frequency) m.connect(c.frequency);
  });

  if (s.output_node) {
    sp.outputId = s.output_node;
    const on = sp.nodes[s.output_node];
    if (on) {
      on.gain.value = 0;
      ensureAnalyser(on);
      const os = s.nodes.find(n => n.id === s.output_node);
      if (os?.params.gain != null) window.synthMasterGain = +os.params.gain;
    }
  }

  const mods = new Set(s.fm_connections.map(fm => fm.mod));
  sp.pitchIds = s.nodes.filter(n => (n.type === 'oscillator' || n.type === 'fm_op') && !mods.has(n.id)).map(n => n.id);
  sp.modIds   = s.nodes.filter(n => mods.has(n.id)).map(n => n.id);
  s.nodes.forEach(n => {
    if (n.type === 'oscillator' || n.type === 'fm_op') {
      const o = sp.nodes[n.id]; if (o) try { o.start(); } catch (_) {}
    }
  });
  console.log('[SynthPatch] built:', s.nodes.map(n => n.id).join(', '));
};

window.synthPatchUpdateParam = function(name, param, val) {
  const n = sp.nodes[name] || sp.nodes['_amp_' + name];
  if (!n) return;
  const pm = { frequency:'frequency', cutoff:'frequency', gain:'gain', q:'Q', waveform:'type', filter_type:'type', amplitude:'gain' };
  const ap = pm[param] || param;
  if (n[ap]?.setValueAtTime) n[ap].setValueAtTime(+val, audioContext.currentTime);
  else if (n[ap] !== undefined) n[ap] = val;
  if (name === sp.outputId && param === 'gain') window.synthMasterGain = +val;
};

// Theremin-style sensor-driven update
window.updateSensorParams = function(freq, fmDepth, active) {
  if (!audioContext || !sp.outputId) return;
  const now   = audioContext.currentTime;
  const T     = window.synthGlideTime != null ? window.synthGlideTime : 0.3;
  const on    = active !== 0;
  const ratio = window.synthModRatio != null ? window.synthModRatio : 1.0;

  sp.pitchIds.forEach(id => {
    const n = sp.nodes[id];
    if (n?.frequency) n.frequency.setTargetAtTime(freq, now, T);
  });
  sp.modIds.forEach(id => {
    const n = sp.nodes[id];
    if (n?.frequency) n.frequency.setTargetAtTime(freq * ratio, now, T);
  });

  const manualDepth = window.synthFmDepthManual != null ? window.synthFmDepthManual : 0;
  const fmAmp = sp.nodes['_amp_fm_mod'];
  const depthScale = window.fmDepthScale != null ? window.fmDepthScale : 400;
  if (fmAmp?.gain) fmAmp.gain.setTargetAtTime(fmDepth * depthScale + manualDepth, now, 0.05);

  const out = sp.nodes[sp.outputId];
  if (out?.gain) out.gain.setTargetAtTime(on ? (window.synthMasterGain || 0.4) : 0, now, on !== _prevActive ? 0.01 : T);
  _prevActive = on;
};

// Init state
window.synthMasterGain    = 0.4;
window.fmDepthScale       = 400;
window.synthGlideTime     = 0.3;
window.synthFmDepthManual = 0;
window.synthModRatio      = 1.0;

// ============================================================
// UI callbacks (called from Ruby)
// ============================================================
window.updateSensorDisplay = function(d, ax, ay, az, f, fm, note) {
  const nd = document.getElementById('note-display');
  const fd = document.getElementById('freq-display');
  const dd = document.getElementById('dist-display');
  if (nd) nd.textContent = note || '--';
  if (fd) fd.textContent = f + 'Hz';
  if (dd) dd.textContent = d + 'mm';
};

window.updateSerialStatus = function(msg, errCount) {
  const connected = msg.includes('connected at');
  document.getElementById('serial-status').textContent = '●';
  document.getElementById('serial-status').style.color = connected ? '#4caf50' : '#f44336';
};

window.updateSerialMonitor = function(line) {
  appendSerialMonitor(line);
};

function appendSerialMonitor(line) {
  const e = document.getElementById('serial-monitor');
  if (!e) return;
  e.textContent = (line + '\n' + e.textContent).substring(0, 2000);
}

// ============================================================
// UI event bridge
// ============================================================

// Preset buttons
document.querySelectorAll('#presets button').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('#presets button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    if (window.rubyOnParamUpdate) window.rubyOnParamUpdate('preset', e.target.dataset.preset);
  });
});

// Scale buttons
document.querySelectorAll('#scale-select button').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('#scale-select button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    if (window.rubyOnParamUpdate) window.rubyOnParamUpdate('scale', e.target.dataset.scale);
  });
});

// Octave
document.getElementById('oct-up').addEventListener('click', () => {
  if (window.rubyOnParamUpdate) window.rubyOnParamUpdate('oct_up', '1');
});
document.getElementById('oct-down').addEventListener('click', () => {
  if (window.rubyOnParamUpdate) window.rubyOnParamUpdate('oct_down', '1');
});

// Glide, Attack, Release sliders
['glide', 'attack', 'release'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => {
    if (window.rubyOnParamUpdate) window.rubyOnParamUpdate(id, el.value);
    const span = document.getElementById(id + '-val');
    if (span) span.textContent = el.value + 'ms';
  });
});

// Curve buttons
document.querySelectorAll('.curve-buttons button').forEach(btn => {
  btn.addEventListener('click', e => {
    const group = e.target.closest('.curve-buttons');
    group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    const prefix = group.dataset.curveTarget;
    if (window.rubyOnParamUpdate) window.rubyOnParamUpdate(prefix + '_curve', e.target.dataset.curve);
  });
});

// Node controls — sliders and selects
document.querySelectorAll('.node input[type="range"], .node select').forEach(el => {
  const event = el.tagName === 'SELECT' ? 'change' : 'input';
  el.addEventListener(event, () => {
    const paramKey = el.dataset.param;
    if (paramKey && window.rubyOnParamUpdate) window.rubyOnParamUpdate(paramKey, el.value);
    // Update adjacent value display
    const row = el.closest('.node-row');
    if (row && el.type === 'range') {
      const nv = row.querySelector('.nv');
      if (nv) nv.textContent = el.value;
    }
  });
});

// Test sliders value display
['test-dist', 'test-ax', 'test-ay', 'test-az'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => {
    const val = document.getElementById(id + '-val');
    if (val) val.textContent = el.value;
  });
});

// Test Mode — send frame
const testSendBtn = document.getElementById('test-send');
if (testSendBtn) {
  testSendBtn.addEventListener('click', () => {
    const d  = document.getElementById('test-dist').value;
    const ax = document.getElementById('test-ax').value;
    const ay = document.getElementById('test-ay').value;
    const az = document.getElementById('test-az').value;
    const dP  = String(d).padStart(4, '0');
    const axP = String(Math.abs(+ax)).padStart(4, '0');
    const ayP = String(Math.abs(+ay)).padStart(4, '0');
    const azP = String(Math.abs(+az)).padStart(4, '0');
    const frame = '<D:' + dP + ',AX:' + axP + ',AY:' + ayP + ',AZ:' + azP + '>\n';
    if (window.rubySerialOnReceive) window.rubySerialOnReceive(frame);
  });
}
